name: Python virtualenv
description: Set up a Python virtual environment with cached package downloads
inputs:
  python-version:
    description: The Python version to use
    required: true
  cache-prefix:
    description: Update this to invalidate the cache
    required: true
    default: v0
runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
        cache-python: true
        cache-dependency-glob: pyproject.toml
        cache-suffix: ${{ inputs.cache-prefix }}-${{ inputs.python-version }}

    - name: Install latest compatible dependencies
      shell: bash
      run: |
        uv venv --seed --clear .venv
        . .venv/bin/activate
        uv pip install --upgrade --torch-backend cpu --editable '.[all]'
        uv pip check

    - shell: bash
      run: |
        # Show environment info.
        . .venv/bin/activate
        echo "✓ Installed $(python --version) virtual environment to $(which python)"
        echo "========= Python packages ==========="
        uv pip freeze
